[tool.ruff]
target-version = "py312"
exclude = ["backend/.venv", "backend/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]
ignore = [
  "S103", # Tool entrypoints intentionally need executable permissions.
  "S110", # Best-effort platform and optional-tool probes may fail silently.
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
